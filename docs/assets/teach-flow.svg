<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 152" width="1120" height="152" role="img" aria-labelledby="t d">
<title id="t">How a demonstration becomes a skill</title>
<desc id="d">Step 1, demonstration: a trace and optional video. The owner shares evidence. Step 2, agent analysis: a proposed procedure. Step 3, owner review: a published skill. With new inputs and a task request, step 4, agent execution: the agent verifies and reports the outcome.</desc>
